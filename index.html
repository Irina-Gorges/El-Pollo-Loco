<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>El Pollo Loco</title>
        <link rel="stylesheet" href="styles/style.css" />
    </head>
    <body onload="init()">
        <main>
            <div id="main_Content">
                <h1>El Pollo Loco</h1>
                <canvas id="canvas" width="720" height="480"></canvas>
                <div id="audio-controls">
                    <label for="volumeSlider">🎵</label>
                    <input
                        type="range"
                        id="volumeSlider"
                        min="0"
                        max="1"
                        step="0.01"
                    />
                    <button id="muteBtn" title="Ton stummschalten / aktivieren">
                        🔇
                    </button>
                </div>

                <div id="info">
                    <div class="rules_Settings">
                        <p>How to Play</p>
                        <span
                            >Left: A &nbsp;&nbsp; Right: D &nbsp;&nbsp; Jump:
                            Space &nbsp;&nbsp; Throw: F
                        </span>
                    </div>
                </div>
                <div class="start-Screen screens d_none" id="startScreen">
                    <button
                        class="StartBtn"
                        id="startButton"
                        onclick="startGame"
                    >
                        START
                    </button>
                </div>
            </div>
        </main>
        <script src="models/drawable-object.class.js"></script>
        <script src="models/movable-object.class.js"></script>
        <script src="models/character.class.js"></script>
        <script src="models/chicken.class.js"></script>
        <script src="models/small-chicken.class.js"></script>
        <script src="models/cloud.class.js"></script>
        <script src="models/statusbar.class.js"></script>
        <script src="models/coinsbar.class.js"></script>
        <script src="models/bottlebar.class.js"></script>
        <script src="models/endbossBar.class.js"></script>
        <script src="models/coin.class.js"></script>
        <script src="models/salsabottles.class.js"></script>
        <script src="models/world.class.js"></script>
        <script src="models/background-object.class.js"></script>
        <script src="models/keyboard.class.js"></script>
        <script src="models/level.class.js"></script>
        <script src="models/throwable-object.class.js"></script>
        <script src="models/endboss.class.js"></script>
        <script src="models/hubs.js"></script>
        <script src="scripts/game.js"></script>
    </body>
</html>
